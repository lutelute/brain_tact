<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<title>brain_tact ロゴギャラリー</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#0d0f13;font-family:-apple-system,system-ui,sans-serif;padding:36px 24px;color:#e6e8eb}
h1{font-size:20px;text-align:center;margin-bottom:6px}
.sub{color:#7b8290;text-align:center;font-size:13px;margin-bottom:36px}
.row{max-width:1000px;margin:0 auto 30px;background:#16181d;border:1px solid #262a32;border-radius:18px;padding:24px}
.row.sel{border-color:#22c55e;box-shadow:0 0 0 1px #22c55e}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#262a32;color:#9aa3b2}
.rname{font-size:16px;font-weight:600}
.rdesc{color:#7b8290;font-size:12px;margin-left:auto}
.specimens{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.spec{text-align:center}
.spec .lbl{color:#6b7280;font-size:10px;margin-top:6px;letter-spacing:.05em}
.lightbg{background:#f4f4f5;border-radius:16px;padding:8px}
.bannerwrap{flex:1;min-width:340px}
h2{font-size:13px;color:#9aa3b2;text-align:center;margin:40px 0 16px;letter-spacing:.1em}
</style></head><body>
<h1>🎛️ brain_tact ロゴギャラリー</h1>
<div class="sub">4案 × 実使用シーン(アプリアイコン / 小サイズ / READMEバナー / ライト背景)。気に入った案の番号を教えてください。</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>

    <!-- 案A: 脳×ネットワーク -->
    <symbol id="markA" viewBox="0 0 200 200">
      <g stroke="#6b7280" stroke-width="1.8"><line x1="100" y1="100" x2="44" y2="50"/><line x1="100" y1="100" x2="156" y2="52"/><line x1="100" y1="100" x2="40" y2="150"/><line x1="100" y1="100" x2="160" y2="148"/></g>
      <g fill="#4b5563"><rect x="34" y="40" width="20" height="16" rx="3"/><rect x="146" y="42" width="20" height="16" rx="3"/><rect x="30" y="142" width="20" height="16" rx="3"/><rect x="150" y="140" width="20" height="16" rx="3"/></g>
      <path d="M100 62 C78 62 70 80 74 92 C64 96 66 116 80 118 C82 132 104 134 100 118 M100 62 C122 62 130 80 126 92 C136 96 134 116 120 118 C118 132 96 134 100 118 M100 62 L100 118" fill="none" stroke="url(#ga)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 案B: 脳×脈波 -->
    <symbol id="markB" viewBox="0 0 200 200">
      <path d="M100 50 C72 50 60 74 66 90 C52 96 54 122 74 124 C76 142 104 144 100 122 M100 50 C128 50 140 74 134 90 C148 96 146 122 126 124 C124 142 96 144 100 122 M100 50 L100 122" fill="none" stroke="#34d399" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30 162 L70 162 L80 142 L92 178 L104 150 L114 162 L170 162" fill="none" stroke="#6ee7b7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 案C: タクト×波 -->
    <symbol id="markC" viewBox="0 0 200 200">
      <g fill="none" stroke="#3b82f6" stroke-linecap="round"><path d="M48 120 Q88 96 128 120 T200 120" stroke-width="2.8"/><path d="M40 140 Q84 110 128 140 T210 140" stroke-width="2.8" opacity="0.6"/><path d="M44 158 Q88 132 132 158 T206 158" stroke-width="2.8" opacity="0.4"/></g>
      <circle cx="60" cy="60" r="7.5" fill="url(#gc)"/><line x1="64" y1="64" x2="140" y2="116" stroke="url(#gc)" stroke-width="5.5" stroke-linecap="round"/>
    </symbol>
    <!-- 案D: タクト×ターミナル -->
    <symbol id="markD" viewBox="0 0 200 200">
      <g><rect x="34" y="116" width="42" height="34" rx="5" fill="#16241a" stroke="#22c55e" stroke-width="1.8"/><rect x="84" y="124" width="42" height="34" rx="5" fill="#16241a" stroke="#22c55e" stroke-width="1.8"/><rect x="134" y="116" width="42" height="34" rx="5" fill="#16241a" stroke="#22c55e" stroke-width="1.8"/>
      <text x="40" y="138" fill="#22c55e" font-family="monospace" font-size="13">&gt;_</text><text x="90" y="146" fill="#22c55e" font-family="monospace" font-size="13">&gt;_</text><text x="140" y="138" fill="#22c55e" font-family="monospace" font-size="13">&gt;_</text></g>
      <circle cx="58" cy="48" r="7" fill="#86efac"/><line x1="62" y1="52" x2="132" y2="98" stroke="#86efac" stroke-width="5" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div id="rows"></div>

<script>
const CASES=[
  {id:'A',name:'脳 × ネットワーク',cat:'脳',bg:'#1a1530',accent:'url(#ga)',tcol:'#c4b5fd',desc:'脳が複数セッションを束ねる'},
  {id:'B',name:'脳 × 脈波(監視)',cat:'脳',bg:'#101a17',accent:'#34d399',tcol:'#6ee7b7',desc:'セッションの鼓動を監視'},
  {id:'C',name:'タクト × 波',cat:'タクト',bg:'#0f1729',accent:'#fbbf24',tcol:'#fcd34d',desc:'指揮棒が複数の声を統率'},
  {id:'D',name:'タクト × ターミナル',cat:'タクト',bg:'#0a0a0a',accent:'#86efac',tcol:'#86efac',desc:'指揮棒がターミナル群を指揮'},
];
function icon(c,size,rx){return `<svg width="${size}" height="${size}" viewBox="0 0 200 200"><rect width="200" height="200" rx="${rx}" fill="${c.bg}"/><use href="#mark${c.id}"/></svg>`}
function banner(c){return `<svg width="640" height="150" viewBox="0 0 640 150">
  <rect width="640" height="150" rx="16" fill="${c.bg}"/>
  <use href="#mark${c.id}" x="20" y="15" width="120" height="120"/>
  <text x="165" y="68" fill="${c.tcol}" font-family="ui-monospace,monospace" font-size="34" font-weight="700">brain_tact</text>
  <text x="166" y="98" fill="#9aa3b2" font-family="-apple-system,sans-serif" font-size="15">散らかった Claude Code セッションを、見て・束ねて・片付ける</text>
  <text x="166" y="120" fill="#5b6472" font-family="ui-monospace,monospace" font-size="12">the conductor for your terminal sessions</text>
</svg>`}
document.getElementById('rows').innerHTML = CASES.map(c=>`
  <div class="row">
    <div class="rhead"><span class="badge">案${c.id} · ${c.cat}</span>
      <span class="rname">${c.name}</span><span class="rdesc">${c.desc}</span></div>
    <div class="specimens">
      <div class="spec">${icon(c,96,22)}<div class="lbl">アプリ 96px</div></div>
      <div class="spec">${icon(c,48,11)}<div class="lbl">48px</div></div>
      <div class="spec">${icon(c,28,6)}<div class="lbl">favicon</div></div>
      <div class="spec"><div class="lightbg">${icon(c,72,16)}</div><div class="lbl">ライト背景</div></div>
      <div class="spec bannerwrap">${banner(c)}<div class="lbl">README バナー</div></div>
    </div>
  </div>`).join('');
</script>
</body></html>
